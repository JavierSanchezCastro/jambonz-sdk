[project]
name = "jambonz-sdk"
version = "0.2.0"
description = "Python SDK for the jambonz CPaaS platform"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Javier Sánchez", email = "javsanchezcas@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["jambonz", "voip", "sip", "cpaas", "telephony", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14",
    "typing-extensions>=4.12",
    "pydantic-settings>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/JavierSanchezCastro/jambonz-sdk"
Documentation = "https://javiersanchezcastro.github.io/jambonz-sdk"
Repository = "https://github.com/JavierSanchezCastro/jambonz-sdk"
Issues = "https://github.com/JavierSanchezCastro/jambonz-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jambonz"]

[dependency-groups]
dev = [
    "fastapi>=0.135.3",
    "mypy>=2.4",
    "mkdocs-material>=9.7.6",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.11",
    "uvicorn>=0.44.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["playground"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Legacy REST client and its tests; long lines left as they were.
"src/jambonz/_base.py" = ["E501"]
"src/jambonz/resources/*" = ["E501"]
"tests/test_client.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Legacy REST client: Calls.create narrows the generic **data signature on purpose.
module = ["jambonz.resources.calls"]
disable_error_code = ["override"]
